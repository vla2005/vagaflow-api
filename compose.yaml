x-laravel: &laravel
  build:
    context: .
    dockerfile: Dockerfile
  image: vagaflow-api:local
  env_file:
    - .env
  environment: &laravel-environment
    DB_CONNECTION: pgsql
    DB_HOST: database
    DB_PORT: 5432
    DB_DATABASE: ${DOCKER_DB_DATABASE:-vagaflow}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-vagaflow}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-vagaflow-local}
    DB_SSLMODE: disable
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    CACHE_STORE: database
  volumes:
    - app-storage:/var/www/html/storage/app
  restart: unless-stopped
  init: true

services:
  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DOCKER_DB_DATABASE:-vagaflow}
      POSTGRES_USER: ${DOCKER_DB_USERNAME:-vagaflow}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-vagaflow-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *laravel
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: *laravel
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=2", "--tries=3", "--timeout=180", "--max-time=3600"]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  app-storage:
  postgres-data:
